<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>サイコロ愛好家の皆様へ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Old+Mincho:wght@700;900&display=swap">
<style>
/* 構成: 白い紙と黒い墨だけの静かな舞台。左右に縦ゲージ、中央に人影。賽の神の目が開くとSANダイスが現れ、怒ると赤いノイズに崩れる。 */
:root{
  --paper:#ffffff;
  --ink:#0a0a0a;
  --ink-soft:#575757;
  --crit:#8dff6e;
  --mid:#faf06e;
  --fumble:#ff7373;
  --pip:#e5201a;
  --display:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --ui:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  color-scheme:light;
}
html,body{background:var(--paper)}
[hidden]{display:none!important}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--ui);font-size:15px;line-height:1.65;
  padding-block:16px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
button,input{font-family:inherit}
.wrap{width:min(100%,1040px);margin-inline:auto}

/* ---------- 舞台 ---------- */
.stage{--q:1cqw;position:relative;container-type:inline-size;width:min(100%,560px);margin-inline:auto;aspect-ratio:25/28;background:var(--paper);overflow:hidden;isolation:isolate;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.stage *{box-sizing:border-box}
.noise{position:absolute;inset:0;width:100%;height:100%;opacity:0;image-rendering:pixelated;z-index:0;transition:opacity .15s}
.fig{position:absolute;left:calc(41*var(--q));top:calc(49*var(--q));width:calc(18*var(--q));height:calc(37.2*var(--q));z-index:1;transform-origin:50% 26%;transition:transform .8s ease;
  -webkit-mask-image:linear-gradient(to bottom,#000 58%,transparent 100%);mask-image:linear-gradient(to bottom,#000 58%,transparent 100%)}
.fig.b{left:calc(40.69*var(--q));width:calc(18.62*var(--q))}
.fig img{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;-webkit-user-drag:none}
.fig .open{opacity:0}
.title{position:absolute;left:calc(6*var(--q));top:calc(4.5*var(--q));margin:0;font:900 calc(6.1*var(--q))/1.2 var(--display);letter-spacing:.2em;white-space:nowrap;z-index:3;color:var(--ink)}

.gauge{position:absolute;top:calc(22*var(--q));height:calc(76*var(--q));width:calc(6.2*var(--q));border:calc(.38*var(--q)) solid var(--ink);background:var(--mid);z-index:3;overflow:hidden}
.gauge.l{left:calc(3*var(--q))}
.gauge.r{right:calc(3*var(--q))}
.gauge i{position:absolute;left:0;right:0;transition:height .7s ease}
.gauge .c{bottom:0;background:var(--crit);height:calc(var(--c) * 1%)}
.gauge .f{top:0;background:var(--fumble);height:calc(var(--f) * 1%)}
/* 目盛り: 1ごとに細く、5ごとに中くらい、25ごとに全幅。値は書かない */
.gauge{--u:calc((calc(76*var(--q)) - calc(.76*var(--q))) / 100)}
.gauge::before{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;
  background-image:
    repeating-linear-gradient(to top,rgba(10,10,10,.3) 0 1px,transparent 1px var(--u)),
    repeating-linear-gradient(to top,rgba(10,10,10,.75) 0 1px,transparent 1px calc(var(--u) * 5)),
    repeating-linear-gradient(to top,#0a0a0a 0 2px,transparent 2px calc(var(--u) * 25));
  background-size:24% 100%,48% 100%,100% 100%;background-repeat:no-repeat;background-position:right bottom;clip-path:inset(0 0 3px 0)}
.gauge.r::before{background-position:left bottom}

.die{position:absolute;left:calc(40.5*var(--q));top:calc(15*var(--q));width:calc(19*var(--q));height:calc(19*var(--q));border:calc(.38*var(--q)) solid var(--ink);background:var(--paper);display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:calc(2*var(--q));z-index:3}
.pip{width:calc(3.6*var(--q));height:calc(3.6*var(--q));border-radius:50%;background:var(--ink);place-self:center;transition:background .6s,box-shadow .6s}
.pip.on{background:var(--pip);box-shadow:0 0 calc(1.6*var(--q)) calc(.3*var(--q)) rgba(229,32,26,.55)}
/* 条件3の目は、見つけた値があるあいだだけ6分割で見える。無点灯のときは他の目と同じ */
.pip.part{background:
  repeating-conic-gradient(from -1.2deg,rgba(255,255,255,.95) 0 2.4deg,transparent 2.4deg calc(360deg / var(--n,6))),
  conic-gradient(var(--pip) 0deg calc(var(--p,0) * 360deg / var(--n,6)),var(--ink) calc(var(--p,0) * 360deg / var(--n,6)) 360deg);
  box-shadow:0 0 calc(1*var(--q)) calc(.1*var(--q)) rgba(229,32,26,.5)}

.slot{position:absolute;top:calc(41*var(--q));width:calc(29*var(--q));z-index:3}
.slot.s1{left:calc(11.5*var(--q))}
.slot.s2{left:calc(59.5*var(--q))}
.box{display:grid;place-items:center;width:100%;aspect-ratio:1;margin:0;padding:0;border:calc(.38*var(--q)) solid var(--ink);background:var(--paper);color:var(--ink);font:900 calc(17*var(--q))/1 var(--display);cursor:default;-webkit-appearance:none;appearance:none;border-radius:0}
.box .num{font-size:calc(13.5*var(--q));letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.box .num.w3{font-size:calc(11*var(--q))}
.box.mine{cursor:pointer}
.box.mine:active{transform:scale(.98)}
.box:focus-visible,.sdie:focus-visible{outline:calc(.7*var(--q)) solid var(--ink);outline-offset:calc(.6*var(--q))}
.box.wait{background:var(--ink);color:var(--paper)}
.tag{margin-top:calc(2.2*var(--q));height:calc(6.4*var(--q));border:calc(.38*var(--q)) solid var(--ink);background:var(--paper);display:flex;align-items:center;justify-content:center;font:700 calc(3.1*var(--q))/1 var(--display);letter-spacing:.18em;padding-inline:calc(1*var(--q));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.san{margin-top:calc(2*var(--q));text-align:center;font:700 calc(3.6*var(--q))/1 var(--display);letter-spacing:.12em;font-variant-numeric:tabular-nums;color:var(--ink)}

/* SANチェック用の普通のダイス（賽の神の目が開いている間だけ現れる） */
.sdie{display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);width:calc(12*var(--q));height:calc(12*var(--q));margin:calc(2.4*var(--q)) auto 0;padding:calc(1.3*var(--q));border:calc(.38*var(--q)) solid var(--ink);background:var(--paper);color:var(--ink);cursor:default;-webkit-appearance:none;appearance:none;border-radius:0}
.sdie.mine{cursor:pointer}
.sdie .sp{width:calc(2.5*var(--q));height:calc(2.5*var(--q));border-radius:50%;background:var(--ink);place-self:center}
.sdie .q{grid-area:1/1/4/4;place-self:center;font:900 calc(6.4*var(--q))/1 var(--display)}

/* ---------- 賽の神の目が開いたとき（画面は変わらない） ---------- */
.stage.eye .fig .open{opacity:1}
.stage.sanlock .box{opacity:.45}
.stage.eye .fig .closed{opacity:0;transition:opacity .12s .1s}
@keyframes lid{0%{clip-path:inset(30% 0 68% 0)}55%{clip-path:inset(20% 0 62% 0)}100%{clip-path:inset(0 0 0 0)}}
@media (prefers-reduced-motion:no-preference){.stage.eye .fig .open{animation:lid .6s cubic-bezier(.2,.7,.3,1)}}

/* ---------- 賽の神の怒り（画面が崩れる） ---------- */
.stage.god .noise{opacity:1;transition:none}
.stage.god .fig{transform:scale(3.3);transition:none;-webkit-mask-image:none;mask-image:none}
/* まばたき（まぶた） */
.lids{position:absolute;inset:0;z-index:15;pointer-events:none;display:none}
.stage.entering .lids{display:block}
.lids i{position:absolute;left:0;right:0;height:50.6%;background:#000;transform:scaleY(0)}
.lids i:first-child{top:0;transform-origin:50% 0;border-radius:0 0 50% 50%/0 0 4% 4%}
.lids i:last-child{bottom:0;transform-origin:50% 100%;border-radius:50% 50% 0 0/4% 4% 0 0}
@keyframes blink{0%{transform:scaleY(0)}10%{transform:scaleY(1)}20%{transform:scaleY(0)}34%{transform:scaleY(0)}46%{transform:scaleY(1)}66%{transform:scaleY(1)}80%{transform:scaleY(0)}100%{transform:scaleY(0)}}
@keyframes thump{0%,69%{scale:1}70%{scale:1.14}74%{scale:.92}78%{scale:1.07}82%,100%{scale:1}}
@keyframes shake{0%,69%{translate:0 0}70%{translate:1.6% -.8%}73%{translate:-1.4% .9%}76%{translate:1% .5%}79%{translate:-.6% -.4%}82%,100%{translate:0 0}}
.stage.god .fig img{filter:drop-shadow(calc(-.3*var(--q)) 0 0 #00e5ff) drop-shadow(calc(.3*var(--q)) 0 0 #ff1a1a) drop-shadow(calc(.55*var(--q)) 0 0 #ffe600)}
.stage.god .die,.stage.god .box,.stage.god .tag,.stage.god .sdie{background:transparent}
.stage.god .box.wait{background:rgba(10,10,10,.85);color:#fff}
.stage.god .sdie{background:rgba(10,10,10,.7)}
.stage.god .sdie .sp{background:#fff}
.stage.god .sdie .q{color:#fff}
.stage.god .die,.stage.god .box,.stage.god .tag,.stage.god .gauge,.stage.god .sdie{box-shadow:calc(-.3*var(--q)) 0 0 #00e5ff,calc(.3*var(--q)) 0 0 #ff1a1a}
.stage.god .title,.stage.god .tag,.stage.god .san,.stage.god .box .face,.stage.god .box .num{text-shadow:calc(-.35*var(--q)) 0 #00e5ff,calc(.35*var(--q)) 0 #ff1a1a,calc(.7*var(--q)) 0 #ffe600}
.stage.god .pip.on{box-shadow:0 0 calc(2*var(--q)) calc(.6*var(--q)) rgba(255,60,40,.9)}

@keyframes slice{
  0%{transform:none;clip-path:none}
  18%{transform:translate(calc(-.8*var(--q)),0);clip-path:inset(0 0 55% 0)}
  20%{transform:translate(calc(.9*var(--q)),0);clip-path:inset(45% 0 0 0)}
  22%{transform:none;clip-path:none}
  61%{transform:translate(calc(.6*var(--q)),calc(.2*var(--q)));clip-path:inset(30% 0 30% 0)}
  63%{transform:none;clip-path:none}
  100%{transform:none;clip-path:none}
}
@keyframes jit{
  0%,100%{transform:none}
  30%{transform:translate(calc(.5*var(--q)),0)}
  32%{transform:translate(calc(-.6*var(--q)),calc(.2*var(--q)))}
  34%{transform:none}
  70%{transform:translate(calc(-.3*var(--q)),0) skewX(-2deg)}
  72%{transform:none}
}
@keyframes enter{
  0%{filter:invert(1)}
  12%{filter:none}
  24%{filter:invert(1) hue-rotate(90deg)}
  36%{filter:none}
  48%{filter:invert(1)}
  60%{filter:none;opacity:.6}
  72%{opacity:1}
  100%{filter:none}
}
@keyframes nudge{0%,100%{transform:none}50%{transform:translateY(calc(-.7*var(--q)))}}
@keyframes ready{0%,100%{opacity:1}50%{opacity:.78}}
@media (prefers-reduced-motion:no-preference){
  .stage.god .title,.stage.god .tag{animation:slice 2.2s steps(1,end) infinite}
  .stage.god .gauge{animation:slice 1.7s steps(1,end) infinite reverse}
  .stage.god .box{animation:jit .9s steps(1,end) infinite}
  .stage.god .fig img{animation:jit 1.3s steps(1,end) infinite}
  .stage.god .fig .open{animation:lid .6s cubic-bezier(.2,.7,.3,1),jit 1.3s steps(1,end) infinite}
  .stage.entering{animation:enter .8s steps(1,end) 1.2s,shake 1.8s steps(1,end)}
  .stage.entering .lids i{animation:blink 1.8s cubic-bezier(.5,0,.6,1) both}
  .stage.entering .fig img{animation:jit 1.3s steps(1,end) infinite,thump 1.8s steps(1,end)}
  .sdie.tap{animation:nudge 1.4s ease-in-out infinite}
  .box.wait{animation:ready 1.2s ease-in-out infinite}
}
@media (prefers-reduced-motion:reduce){
  .fig,.stage.god .fig,.stage.god .noise,.stage.eye .fig .closed,.gauge i,.pip{transition:none}
}

/* ---------- ゲームオーバー / クリア ---------- */
.ov{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:calc(6*var(--q))}
.ov.over{background:repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 calc(.3*var(--q)),transparent calc(.3*var(--q)) calc(.9*var(--q))),#0a0a0a;color:#fff}
.ov.clear{background:var(--paper);color:var(--ink)}
.ov-title{margin:0;font:900 calc(14*var(--q))/1.15 var(--display);letter-spacing:.14em}
.ov.over .ov-title{font-size:calc(12.5*var(--q));letter-spacing:.05em;white-space:nowrap;text-shadow:calc(-.5*var(--q)) 0 #00e5ff,calc(.5*var(--q)) 0 #ff1a1a,calc(1*var(--q)) 0 #ffe600}
.ov-sub{margin:0 0 calc(4*var(--q));font:700 calc(3.8*var(--q))/1.5 var(--display);letter-spacing:.14em;color:#ff7373}
.ov-btn{margin-top:calc(9*var(--q));padding:calc(2.6*var(--q)) calc(8*var(--q));border:calc(.5*var(--q)) solid #fff;background:transparent;color:#fff;font:900 calc(5.4*var(--q))/1 var(--display);letter-spacing:.16em;cursor:pointer;border-radius:0}
@media (hover:hover){.ov-btn:hover{background:#fff;color:#0a0a0a}}
.ov-btn:active{background:#fff;color:#0a0a0a}
.ov-btn:focus-visible{outline:calc(.7*var(--q)) solid #ff7373;outline-offset:calc(.8*var(--q))}
.ov-note{margin:calc(4*var(--q)) 0 0;min-height:1.5em;font:500 calc(3*var(--q))/1.5 var(--ui);color:#cfcfcf}
.ov-kicker{margin:0 0 calc(3*var(--q));font:700 calc(3.8*var(--q))/1.4 var(--display);letter-spacing:.3em;color:var(--ink-soft)}
.ov.clear .ov-title{font-size:calc(15*var(--q));margin-bottom:calc(5*var(--q))}
.credits{margin:0;display:grid;gap:calc(2.6*var(--q));width:100%;max-width:calc(78*var(--q))}
.credits div{display:grid;gap:calc(.8*var(--q))}
.credits dt{font:500 calc(2.9*var(--q))/1.3 var(--ui);letter-spacing:.24em;color:var(--ink-soft)}
.credits dd{margin:0;font:900 calc(4.6*var(--q))/1.3 var(--display);letter-spacing:.1em;overflow-wrap:anywhere}
.credits dd.sm{font-size:calc(3.3*var(--q));font-weight:700;letter-spacing:.06em}
.ov-end{margin:calc(6*var(--q)) 0 0;font:700 calc(3.2*var(--q))/1 var(--display);letter-spacing:.3em;color:var(--ink-soft)}
@keyframes rise{from{opacity:0;transform:translateY(calc(2.4*var(--q)))}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:no-preference){
  .ov.clear .ov-kicker,.ov.clear .ov-title,.ov.clear .credits>div,.ov.clear .ov-end{animation:rise .9s ease both}
  .ov.clear .ov-title{animation-delay:.25s}
  .ov.clear .credits>div:nth-child(1){animation-delay:.9s}
  .ov.clear .credits>div:nth-child(2){animation-delay:1.3s}
  .ov.clear .credits>div:nth-child(3){animation-delay:1.7s}
  .ov.clear .credits>div:nth-child(4){animation-delay:2.1s}
  .ov.clear .ov-end{animation-delay:2.6s}
  .ov.over .ov-title{animation:jit 1.1s steps(1,end) infinite}
}

/* ---------- 画面サイズへの対応（スマホ・タブレット・PC） ---------- */
.wrap.player{width:100%}
@supports (height:100dvh){
  .wrap.player{--sw:min(100%,calc((100dvh - 170px) * .8929),900px)}
  .player .stage,.player .cap{width:var(--sw)}
}
@media (min-aspect-ratio:5/4) and (min-width:700px){
  @supports (height:100dvh){.wrap.player{--sw:min(100%,calc((100dvh - 170px) * 1.9048),1600px)}}
  .player .stage{aspect-ratio:40/21;--q:.5cqw}
  .player .credits{grid-template-columns:1fr 1fr;column-gap:calc(8*var(--q));max-width:calc(130*var(--q))}
  .player .ov.clear .ov-title{margin-bottom:calc(5*var(--q))}
  .player .ov-end{margin-top:calc(6*var(--q))}
  .player .title{left:0;width:100%;text-align:center}
  .player .die{left:calc(90.5*var(--q))}
  .player .fig{left:calc(87.85*var(--q));width:calc(24.3*var(--q));height:calc(50.2*var(--q))}
  .player .fig.b{left:calc(87.43*var(--q));width:calc(25.14*var(--q))}
  .player .slot.s1{left:calc(28*var(--q))}
  .player .slot.s2{left:calc(143*var(--q))}
  .player .gauge.l{left:calc(6*var(--q))}
  .player .gauge.r{right:calc(6*var(--q))}
}
/* ---------- 共通パーツ ---------- */
.cap{width:min(100%,560px);margin:16px auto 0}
.cap p{margin:0 0 8px}
.how{font-size:14px}
.msg{min-height:1.65em;font-size:14px;font-weight:700}
.status{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;font-size:12.5px;color:var(--ink-soft)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink-soft);flex:none}
.status[data-s="live"] .dot{background:#1c9c3a}
.status[data-s="slow"] .dot,.status[data-s="writefail"] .dot,.status[data-s="error"] .dot,.status[data-s="readonly"] .dot{background:var(--pip)}
.link{background:none;border:0;padding:2px 0;font:inherit;color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.link:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* ---------- 役割の選択 ---------- */
.pick{text-align:center}
.pick h1{margin:6vh 0 10px;font:900 clamp(26px,7vw,44px)/1.25 var(--display);letter-spacing:.14em}
.pick p{max-width:34em;margin:0 auto 6px}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:22px auto 0;max-width:560px}
.roles button{border:2px solid var(--ink);background:var(--paper);color:var(--ink);padding:22px 12px;font:900 20px var(--display);letter-spacing:.14em;cursor:pointer;border-radius:0}
.roles button small{display:block;margin-top:4px;font:500 12px var(--ui);letter-spacing:.04em;color:inherit}
@media (hover:hover){.roles button:hover{background:var(--ink);color:var(--paper)}}

/* ---------- GM画面 ---------- */
.bar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 16px;border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:20px}
.brand{margin:0;font:900 22px/1.3 var(--display);letter-spacing:.12em}
.brand small{font:500 13px var(--ui);letter-spacing:.05em;margin-left:10px;color:var(--ink-soft)}
.wrap.gm{width:min(100%,1400px)}
.gm-grid{display:grid;grid-template-columns:minmax(0,min(44vw,560px)) minmax(0,1fr);gap:28px;align-items:start}
.gm-grid>div{min-width:0}
@media (min-width:861px){.gm-grid>div:first-child{position:sticky;top:12px}}
@media (max-width:860px){.gm-grid{grid-template-columns:minmax(0,1fr)}}
.gm .stage{width:100%;outline:2px solid var(--ink);outline-offset:-2px}
@supports (height:100dvh){@media (min-width:861px){.gm .stage{width:min(100%,calc((100dvh - 170px) * .8))}}}
.hint{margin:10px 0 0;font-size:12.5px;color:var(--ink-soft)}
.notice{margin:0 0 14px;padding:10px 12px;border:2px solid var(--pip);font-size:13.5px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,350px),1fr));gap:16px;margin-top:18px}
.card{border:2px solid var(--ink);padding:14px;display:grid;gap:12px;min-width:0;align-content:start}
.card h2{margin:0;font:900 18px/1.3 var(--display);letter-spacing:.14em;overflow-wrap:anywhere}
.nm{display:flex;gap:8px;align-items:center;font-size:12.5px;margin-top:6px}
.nm input{flex:1;min-width:0}
input[type="text"],input[type="number"]{border:1.5px solid var(--ink);background:var(--paper);color:var(--ink);padding:6px 8px;font-size:15px;border-radius:0}
.line{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.k{font-weight:700;font-size:13px;min-width:5.6em}
.line output{font:700 17px var(--display);font-variant-numeric:tabular-nums;letter-spacing:.04em}
.line .n{font-size:12px;color:var(--ink-soft)}
.steps{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto;align-items:center}
.steps input[type="number"]{width:4.6em;text-align:center;font-variant-numeric:tabular-nums}
.btn{min-width:44px;height:40px;border:1.5px solid var(--ink);background:var(--paper);color:var(--ink);font:700 14px var(--ui);cursor:pointer;border-radius:0;padding:0 8px}
@media (hover:hover){.btn:hover:not(:disabled){background:var(--ink);color:var(--paper)}}
.btn:active:not(:disabled){background:var(--ink);color:var(--paper)}
.btn:disabled,input:disabled{opacity:.45;cursor:not-allowed}
.btn.wide{padding:0 14px}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.btn.hot[aria-pressed="true"]{background:var(--pip);border-color:var(--pip);color:#fff}
.note{margin:0;font-size:12px;color:var(--ink-soft)}
.group{display:grid;gap:8px;border-top:1px solid var(--ink);padding-top:10px}
.group>.k{min-width:0}
.sdrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.sdrow .st{font-size:13.5px;flex:1 1 9em}
.sdrow .st b{font:900 17px var(--display)}
.last{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;border-top:1px solid var(--ink);padding-top:10px}
.last output{font:900 28px/1 var(--display);font-variant-numeric:tabular-nums}
.last .n{font-size:12.5px;color:var(--ink-soft)}
.badge{font:700 12px var(--ui);letter-spacing:.1em;padding:1px 8px;border:1.5px solid var(--ink)}
.badge:empty{display:none}
.badge.c{background:var(--crit)}
.badge.f{background:var(--fumble)}
.badge.w{background:var(--ink);color:var(--paper)}
.sec{margin-top:18px;border:2px solid var(--ink);padding:14px;display:grid;gap:12px;min-width:0}
.sec:first-child{margin-top:0}
.sec h2{margin:0;font:900 16px var(--display);letter-spacing:.14em}
.seg,.pipbtns,.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.gods{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.mode{margin:0;font-size:14px}
.mode b{font:900 17px var(--display);letter-spacing:.1em}
.pb{display:inline-flex;align-items:center;gap:8px;padding:0 14px}
.pb i{width:14px;height:14px;border-radius:50%;background:var(--ink);display:inline-block;border:1.5px solid var(--paper)}
.pb[aria-pressed="true"]{background:var(--paper);color:var(--ink);border-color:var(--pip);box-shadow:inset 0 0 0 1.5px var(--pip)}
.pb[aria-pressed="true"] i{background:var(--pip);border-color:var(--pip)}
.chip{min-width:52px;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--pip);border-color:var(--pip);color:#fff}
.totals{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.tot{border:2px solid var(--ink);padding:10px 12px;display:grid;gap:6px}
.tot.hit{border-color:var(--pip)}
.tot .h{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;font-size:13px;font-weight:700}
.tot .h output{font:900 22px/1 var(--display);font-variant-numeric:tabular-nums}
.meter{height:8px;border:1.5px solid var(--ink)}
.meter i{display:block;height:100%;background:var(--ink)}
.tot.hit .meter i{background:var(--pip)}
.log{margin:0;padding-left:1.3em;font-size:12.5px;color:var(--ink-soft);display:grid;gap:2px}
.dangerbtn{justify-self:start;height:42px;padding:0 14px;border:1.5px dashed var(--ink);background:var(--paper);color:var(--ink);font:700 14px var(--ui);cursor:pointer;border-radius:0}
.dangerbtn[data-armed="1"]{background:var(--pip);border:1.5px solid var(--pip);color:#fff}

<script>
/* 公開用: claude.ai の db / user の代わりに Firebase（Realtime Database + Authentication）を使う */
(function(){
const CFG={
  apiKey:"AIzaSyCpZrCJgRWh5hE_DA74dBfN1r2B4A3tpso",
  authDomain:"saino-kami.firebaseapp.com",
  databaseURL:"https://saino-kami-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"saino-kami",
  storageBucket:"saino-kami.firebasestorage.app",
  messagingSenderId:"1083724433091",
  appId:"1:1083724433091:web:d798d6f6693ad744e4c476"
};
const BASE=window.__FB_BASE||'https://www.gstatic.com/firebasejs/10.12.2/firebase-';
const role=()=>location.hash.replace(/^#/,'');
window.addEventListener('hashchange',()=>location.reload());
const meta={fromCache:false,hasPendingWrites:false};
let P=null;

function loginUI(Au,auth){
  return new Promise(resolve=>{
    const box=document.createElement('div');
    box.style.cssText='position:fixed;inset:0;z-index:99999;background:#fff;display:flex;align-items:center;justify-content:center;padding:16px;font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;color:#0a0a0a';
    box.innerHTML='<form style="width:min(100%,360px);display:grid;gap:12px">'+
      '<h1 style="margin:0 0 4px;font:900 22px/1.3 \'Zen Old Mincho\',serif;letter-spacing:.12em">GMログイン</h1>'+
      '<label style="display:grid;gap:4px;font-size:13px">メールアドレス<input name="e" type="email" autocomplete="username" required style="font:inherit;font-size:16px;padding:10px;border:2px solid #0a0a0a;border-radius:0"></label>'+
      '<label style="display:grid;gap:4px;font-size:13px">パスワード<input name="p" type="password" autocomplete="current-password" required style="font:inherit;font-size:16px;padding:10px;border:2px solid #0a0a0a;border-radius:0"></label>'+
      '<button type="submit" style="font-weight:700;font-size:16px;font-family:inherit;padding:12px;border:2px solid #0a0a0a;background:#0a0a0a;color:#fff;border-radius:0;cursor:pointer">ログイン</button>'+
      '<p class="err" role="alert" style="margin:0;min-height:1.5em;font-size:13px;color:#b00020"></p>'+
      '<a href="#" style="font-size:13px;color:#0a0a0a">役割を選び直す</a></form>';
    document.body.appendChild(box);
    const f=box.querySelector('form'),err=box.querySelector('.err'),btn=box.querySelector('button');
    f.addEventListener('submit',async ev=>{
      ev.preventDefault();btn.disabled=true;err.textContent='';
      try{
        await Au.signInWithEmailAndPassword(auth,f.e.value.trim(),f.p.value);
        box.remove();resolve();
      }catch(e){
        err.textContent=(e&&(e.code==='auth/network-request-failed'))?'通信に失敗しました。接続を確認してください。':'メールアドレスかパスワードが違います。';
        btn.disabled=false;
      }
    });
  });
}

async function init(){
  if(P)return P;
  P=(async()=>{
    const [A,Au,D]=await Promise.all([import(BASE+'app.js'),import(BASE+'auth.js'),import(BASE+'database.js')]);
    const app=A.initializeApp(CFG);
    const auth=Au.getAuth(app);
    const db=D.getDatabase(app);
    const first=await new Promise(r=>{const un=Au.onAuthStateChanged(auth,u=>{un();r(u);});});
    if(role()==='gm'){
      if(!(first&&!first.isAnonymous))await loginUI(Au,auth);
    }else if(!first){
      await Au.signInAnonymously(auth);
    }
    const isGM=!!(auth.currentUser&&!auth.currentUser.isAnonymous);
    const docSnap=(id,s)=>{const v=s.val();return {id:id,exists:v!==null&&v!==undefined,data:()=>v,metadata:meta};};
    const api={
      doc(path){
        const id=path.split('/').pop();
        return {
          path:path,id:id,
          set:v=>D.set(D.ref(db,path),JSON.parse(JSON.stringify(v))),
          delete:()=>D.remove(D.ref(db,path)),
          onSnapshot:(next,err)=>D.onValue(D.ref(db,path),s=>next(docSnap(id,s)),e=>{if(err)err(e);})
        };
      },
      collection(col){
        return {
          path:col,
          doc:id=>api.doc(col+'/'+id),
          onSnapshot:(next,err)=>D.onValue(D.ref(db,col),s=>{
            const docs=[];
            s.forEach(c=>{docs.push(docSnap(c.key,c));});
            next({docs:docs,size:docs.length,empty:!docs.length,metadata:meta});
          },e=>{if(err)err(e);})
        };
      }
    };
    return {db:api,user:{canEdit:async()=>isGM,can:async()=>true}};
  })();
  return P;
}
window.claude={use:async name=>{
  try{
    const r=await init();
    return name==='db'?r.db:(name==='user'?r.user:null);
  }catch(e){return null;}
}};
})();
</script>

const Snd=(()=>{
  let ctx=null,on=true,nb=null,rollBuf=null,decoding=false,lastRoll=0,lastFan=0;
  try{on=localStorage.getItem('saino-snd')!=='off';}catch(e){}
  function prep(c){
    if(rollBuf||decoding)return;

    try{
      const bin=atob(SND_ROLL.split(',')[1]),u=new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
      const pr=c.decodeAudioData(u.buffer,b=>{rollBuf=b;},()=>{decoding=false;});
      if(pr&&pr.catch)pr.catch(()=>{decoding=false;});
    }catch(e){decoding=false;}
  }
  function get(){
    if(!ctx){
      const AC=window.AudioContext||window.webkitAudioContext;
      if(!AC)return null;
      try{ctx=new AC();}catch(e){return null;}
      prep(ctx);
    }
    if(ctx.state==='suspended'){try{ctx.resume();}catch(e){}}
    return ctx;
  }
  function noise(c){
    if(!nb){
      nb=c.createBuffer(1,Math.floor(c.sampleRate*.6),c.sampleRate);

  function clack(c,t,vol,freq){
    const src=c.createBufferSource();src.buffer=noise(c);
    const f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=freq;f.Q.value=2.2;
    const g=c.createGain();
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+.055);
    src.connect(f);f.connect(g);g.connect(c.destination);

  }

  }

        return;
      }
      let t=c.currentTime+.01,gap=short?.045:.036;
      const n=short?6:9;
      for(let i=0;i<n;i++){
        clack(c,t,(.22+Math.random()*.2)*(1-i/(n*1.6)),1500+Math.random()*2600);
        t+=gap;gap*=1.2+Math.random()*.06;
      }
    },
    fanfare(){
      if(!on)return;
      const now=Date.now();
      if(now-lastFan<1500)return;
      lastFan=now;
      const c=get();if(!c)return;
      const t=c.currentTime+.02;
      [[523.25,0],[659.25,.11],[783.99,.22],[1046.5,.33]].forEach(n=>note(c,t+n[1],n[0],.16,.16,'square'));
      [[783.99,.5],[987.77,.5],[1174.66,.5],[1567.98,.5]].forEach(n=>note(c,t+n[1],n[0],.7,.1,'triangle'));
      note(c,t+.5,523.25,.7,.14,'square');
    },
    tv(){
      if(!on)return;
      const c=get();if(!c)return;
      const t0=c.currentTime,dur=.18+Math.random()*.35;
      const src=c.createBufferSource();src.buffer=noise(c);src.loop=true;
      const f=c.createBiquadFilter();f.type='highpass';f.frequency.value=1200;
      const g=c.createGain();
      g.gain.setValueAtTime(0,t0);
      let t=t0;
      while(t<t0+dur){
        const seg=.02+Math.random()*.05;
        g.gain.setValueAtTime(.05+Math.random()*.1,t);
        t+=seg;
        g.gain.setValueAtTime(Math.random()<.3?0:.04,t);
      }
      g.gain.setValueAtTime(0,t0+dur);
      src.connect(f);f.connect(g);g.connect(c.destination);
      src.start(t0);src.stop(t0+dur+.02);
    }
  };
})();

function toInt(v,min,max,def){v=Number(v);return Number.isFinite(v)?clamp(Math.round(v),min,max):def;}

function normalize(d){
  d=d&&typeof d==='object'?d:{};
  const s=clone(DEFAULT_STATE);
  ROLES.forEach(r=>{
    const nm=d.names&&d.names[r];
    if(typeof nm==='string'&&nm.trim())s.names[r]=nm.trim().slice(0,12);
    s.san[r]=toInt(d.san&&d.san[r],0,999,s.san[r]);
    s.crit[r]=toInt(d.crit&&d.crit[r],0,49,s.crit[r]);
    s.fumble[r]=toInt(d.fumble&&d.fumble[r],51,101,s.fumble[r]);
    const w=d.words&&d.words[r];
    s.words[r]={sai:toInt(w&&w.sai,0,9999,0),dice:toInt(w&&w.dice,0,9999,0)};
    s.sanOn[r]=!!(d.sanOn&&d.sanOn[r]===true);
    s.sanDue[r]=!!(d.sanDue&&d.sanDue[r]===true);
  });
  s.pipCount=5;
  if(Array.isArray(d.pips))s.pips=s.pips.map((_,i)=>d.pips[i]===true);
  if(Array.isArray(d.found))s.found=FOUND_SET.filter(v=>d.found.indexOf(v)>=0);
  s.guessed=toInt(d.guessed,0,GUESS_N,0);
  s.god=d.god===true?2:toInt(d.god,0,2,0);
  if(s.god===2)ROLES.forEach(r=>{s.sanOn[r]=true;});
  else if(s.god===0)ROLES.forEach(r=>{s.sanOn[r]=false;});
  else if(!ROLES.some(r=>s.sanOn[r]))s.god=0;
  ROLES.forEach(r=>{if(s.god===0||!s.sanOn[r])s.sanDue[r]=false;});
  s.auto=d.auto!==false;
  return s;
}

/* ---------- データ ---------- */
const store={state:normalize(null),rolls:{},sans:{},db:null,status:'connecting',canEdit:null,canWrite:null,listeners:new Set(),isGM:false,processed:null,log:[],contPending:false,ctlNonce:undefined};
function emit(){store.listeners.forEach(f=>{try{f();}catch(e){console.error(e);}});}
function setStatus(s){store.status=s;emit();}
function addLog(msg){
  const t=new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});
  store.log.unshift(t+'  '+msg);
  if(store.log.length>10)store.log.length=10;
  emit();
}
const STATUS_TEXT={
  connecting:'接続中…',
  live:'接続済み',
  slow:'接続に時間がかかっています。通信状態を確認してください。',
  offline:'この画面は単独表示です。操作は他の端末には届きません。',
  writefail:'送信できませんでした。「貢献者」以上の権限が必要です。',
  error:'接続が切れました。ページを読み込み直してください。',
  readonly:'このリンクでは操作できません。主催者に「貢献者」権限をもらってください。'
};

/* 出目: rounds/<p1|p2> = {n: 押した回数, v: 最新の値, pv: ひとつ前の値}
   自分のnが相手のnより大きいあいだは「待機中」で、値は相手が押すまで見えない。 */
const nOf=k=>(store.rolls[k]?store.rolls[k].n:0);
function shownOf(k){
  const rec=store.rolls[k];
  if(!rec||rec.n===0)return {kind:'none'};
  if(rec.n>nOf(other(k)))return {kind:'pending',n:rec.n};
  return {kind:'value',n:rec.n,value:rec.v};
}
const completedRound=()=>Math.min(nOf('p1'),nOf('p2'));
function roundValue(k,r){
  const x=store.rolls[k];
  if(!x)return undefined;
  if(x.n===r)return x.v;
  if(x.n===r+1)return x.pv;
  return undefined;
}
const sanBlocked=()=>!!(store.state.sanDue&&(store.state.sanDue.p1||store.state.sanDue.p2));
function canRoll(k){return store.canWrite!==false&&!sanBlocked()&&nOf(k)<=nOf(other(k));}

let saveTimer=null,saveBusy=false;
const gmBusy=()=>saveTimer!==null||saveBusy;
function gmEdit(fn){
  const s=clone(store.state);fn(s);
  store.state=normalize(s);emit();
  clearTimeout(saveTimer);saveTimer=setTimeout(flush,180);
}
async function flush(){
  saveTimer=null;
  if(saveBusy){saveTimer=setTimeout(flush,180);return;}
  if(!store.db)return;
  saveBusy=true;
  const payload=clone(store.state);
  try{
    await store.db.doc('game/v2').set(payload);
    if(store.status==='writefail')setStatus('live');
  }catch(e){setStatus('writefail');}
  saveBusy=false;
}
async function submitRoll(k){
  if(!canRoll(k))return;
  const prev=store.rolls[k]||{n:0,v:0};
  const rec={n:prev.n+1,v:rnd(),pv:prev.n>0?prev.v:0,at:Date.now()};
  store.rolls=Object.assign({},store.rolls,{[k]:rec});
  emit();
  if(!store.db)return;
  try{
    await store.db.doc('rounds/'+k).set(rec);
    if(store.status==='writefail')setStatus('live');
  }catch(e){setStatus('writefail');}
}
async function submitSan(k){
  const prev=store.sans[k]||{value:0,n:0};
  if(prev.value>0)return;
  const rec={value:rnd6(),n:prev.n+1};
  store.sans=Object.assign({},store.sans,{[k]:rec});
  emit();
  if(!store.db)return;
  try{
    await store.db.doc('sans/'+k).set(rec);
    if(store.status==='writefail')setStatus('live');
  }catch(e){setStatus('writefail');}
}
async function clearSans(list){
  list.forEach(k=>{
    const prev=store.sans[k]||{value:0,n:0};
    store.sans=Object.assign({},store.sans,{[k]:{value:0,n:prev.n}});
  });
  emit();
  if(!store.db)return;
  try{await Promise.all(list.map(k=>store.db.doc('sans/'+k).set({value:0,n:(store.sans[k]||{}).n||0})));}
  catch(e){setStatus('writefail');}
}
async function cancelWait(k){
  const rec=store.rolls[k];
  if(!rec||rec.n<=nOf(other(k)))return;
  const nrec={n:rec.n-1,v:rec.pv,pv:0,at:Date.now()};
  store.rolls=Object.assign({},store.rolls,{[k]:nrec});
  emit();
  if(!store.db)return;
  try{await store.db.doc('rounds/'+k).set(nrec);}catch(e){setStatus('writefail');}
}
async function resetAll(){
  gmEdit(s=>{Object.assign(s,clone(DEFAULT_STATE));});
  store.rolls={};store.sans={};store.log=[];store.contPending=false;
  if(store.processed!==null)store.processed=0;
  emit();
  if(store.db){
    try{await Promise.all(ROLES.map(r=>store.db.doc('rounds/'+r).delete()).concat(ROLES.map(r=>store.db.doc('sans/'+r).delete()),[store.db.doc('control/continue').delete()]));}
    catch(e){setStatus('writefail');}
  }
}

async function requestContinue(){
  if(store.isGM){resetAll();return;}
  store.contPending=true;emit();
  if(!store.db)return;
  try{await store.db.doc('control/continue').set({at:Date.now(),nonce:Math.random().toString(36).slice(2)});}
  catch(e){setStatus('writefail');}
}

/* ---------- GMの自動判定（条件2・3、ファンブルによる賽の神） ---------- */
function gmProcess(fromCache){
  const r=completedRound();
  if(store.processed===null){if(!fromCache)store.processed=r;return;}
  if(r<store.processed){store.processed=r;return;}
  if(r===store.processed)return;
  store.processed=r;
  const v1=roundValue('p1',r),v2=roundValue('p2',r);
  if(!(v1>0&&v2>0))return;
  const s0=store.state,nm=s0.names;
  addLog('第'+r+'回  '+nm.p1+' '+v1+' / '+nm.p2+' '+v2);
  if(s0.god===2)gmEdit(s=>{ROLES.forEach(k=>{s.sanDue[k]=true;});});
  if(!s0.auto)return;
  const c1=v1<=s0.crit.p1,c2=v2<=s0.crit.p2,f1=v1>=s0.fumble.p1,f2=v2>=s0.fumble.p2;
  const newFound=[];
  [v1,v2].forEach(v=>{if(FOUND_SET.indexOf(v)>=0&&s0.found.indexOf(v)<0&&newFound.indexOf(v)<0)newFound.push(v);});
  const msgs=[],toClear=[];
  gmEdit(s=>{
    if(c1&&c2&&!s.pips[1]){s.pips[1]=true;msgs.push('2人同時クリティカル → 目2を点灯');}
    [['p1',c1],['p2',c2]].forEach(a=>{
      if(a[1]&&s.crit[a[0]]<49){s.crit[a[0]]+=1;msgs.push(nm[a[0]]+'がクリティカル → クリティカル範囲＋1（1–'+s.crit[a[0]]+'）');}
    });
    newFound.forEach(v=>{s.found.push(v);});
    if(newFound.length)msgs.push('条件3: '+newFound.join('、')+' を発見（'+(s.found.length)+'/6）');
    if(f1&&f2){
      if(s.god<2){s.god=2;ROLES.forEach(k=>{s.sanDue[k]=true;});toClear.push('p1','p2');msgs.push('2人同時ファンブル → 賽の神の怒り');}
    }else if(f1||f2){
      const k=f1?'p1':'p2';
      if(s.god<2){s.god=1;s.sanOn[k]=true;s.sanDue[k]=true;toClear.push(k);msgs.push(nm[k]+'がファンブル → 賽の神が目を開く');}
    }
  });
  msgs.forEach(addLog);
  if(toClear.length)clearSans(toClear);
}

async function connect(){
  let db=null,user=null;
  try{
    if(window.claude&&window.claude.use){
      db=await window.claude.use('db');
      user=await window.claude.use('user');
    }
  }catch(e){}
  if(user){
    try{store.canEdit=await user.canEdit();store.canWrite=await user.can('data.write');}catch(e){}
  }
  if(!db){setStatus('offline');return;}
  store.db=db;
  const timer=setTimeout(()=>{if(store.status==='connecting')setStatus('slow');},10000);
  const live=()=>{clearTimeout(timer);if(store.status==='connecting'||store.status==='slow')setStatus('live');};
  db.doc('game/v2').onSnapshot(snap=>{
    if(!gmBusy())store.state=normalize(snap.exists?snap.data():null);
    if(!snap.metadata.fromCache)live();
    emit();
  },()=>setStatus('error'));
  db.collection('rounds').onSnapshot(snap=>{
    const r={};
    snap.docs.forEach(d=>{
      const v=d.data();
      if(v&&(d.id==='p1'||d.id==='p2'))r[d.id]={n:toInt(v.n,0,1000000,0),v:toInt(v.v,1,100,1),pv:toInt(v.pv,0,100,0),at:Number(v.at)||0};
    });
    store.rolls=r;
    if(!snap.metadata.fromCache)live();
    if(store.isGM)gmProcess(snap.metadata.fromCache);
    emit();
  },()=>setStatus('error'));
  db.doc('control/continue').onSnapshot(snap=>{
    const dat=snap.exists?snap.data():null;
    const nonce=dat&&dat.nonce?String(dat.nonce):null;
    if(store.ctlNonce===undefined){store.ctlNonce=nonce;return;}
    if(nonce&&nonce!==store.ctlNonce){
      store.ctlNonce=nonce;
      if(store.isGM){addLog('Continue が押されたので初期化');resetAll();}
    }else if(!nonce){store.ctlNonce=null;}
  },()=>{});
  db.collection('sans').onSnapshot(snap=>{
    const r={};
    snap.docs.forEach(d=>{
      const v=d.data();
      if(v&&(d.id==='p1'||d.id==='p2'))r[d.id]={value:toInt(v.value,0,6,0),n:toInt(v.n,0,1000000,0)};
    });
    store.sans=r;
    emit();
  },()=>setStatus('error'));
}

function overlayHTML(){
  return '<div class="ov over" role="alert" hidden>'+
      '<p class="ov-sub" data-o="oversub"></p>'+
      '<h2 class="ov-title">Game Over</h2>'+
      '<button type="button" class="ov-btn" data-o="cont">Continue？</button>'+
      '<p class="ov-note" data-o="contnote"></p>'+
    '</div>'+
    '<div class="ov clear" hidden>'+
      '<p class="ov-kicker">サイコロ愛好家の皆様へ</p>'+
      '<h2 class="ov-title">脱出成功</h2>'+
      '<dl class="credits">'+CREDITS.map(c=>'<div><dt>'+c[0]+'</dt><dd'+(c[2]?' class="sm"':'')+'>'+c[1]+'</dd></div>').join('')+'</dl>'+
      '<p class="ov-end">Thank you for playing</p>'+
    '</div>';
}
function stageHTML(heading,god){
  const T=heading?'h1':'p';
  const slot=(k,n)=>'<div class="slot s'+n+'">'+
    '<button type="button" class="box" data-r="'+k+'"><span class="face">賽</span></button>'+
    '<div class="tag" data-r="'+k+'"></div><div class="san" data-r="'+k+'"></div>'+
    '<button type="button" class="sdie" data-r="'+k+'" hidden></button></div>';
  return '<canvas class="noise" width="128" height="160" aria-hidden="true"></canvas>'+
    '<div class="fig'+(god==='b'?' b':'')+'" aria-hidden="true"><img class="closed" alt="" src="'+(god==='b'?IMG_CLOSED_B:IMG_CLOSED)+'"><img class="open" alt="" src="'+(god==='b'?IMG_OPEN_B:IMG_OPEN)+'"></div>'+
    '<'+T+' class="title">サイコロ愛好家の皆様へ</'+T+'>'+
    '<div class="gauge l" data-g="p1" aria-hidden="true"><i class="c"></i><i class="f"></i></div>'+
    '<div class="gauge r" data-g="p2" aria-hidden="true"><i class="c"></i><i class="f"></i></div>'+
    '<div class="die" aria-hidden="true">'+'<i class="pip"></i>'.repeat(5)+'</div>'+
    slot('p1',1)+slot('p2',2)+'<div class="lids" aria-hidden="true"><i></i><i></i></div>'+overlayHTML();
}

function createStage(role,handlers,opts){
  const el=document.createElement('div');
  el.className='stage';
  el.innerHTML=stageHTML(!!(opts&&opts.heading),opts&&opts.god);
  const cv=el.querySelector('.noise');
  const boxes={},tags={},sans={},gauges={},sdies={};
  ROLES.forEach(k=>{
    boxes[k]=el.querySelector('.box[data-r="'+k+'"]');
    tags[k]=el.querySelector('.tag[data-r="'+k+'"]');
    sans[k]=el.querySelector('.san[data-r="'+k+'"]');
    sdies[k]=el.querySelector('.sdie[data-r="'+k+'"]');
    gauges[k]=el.querySelector('.gauge[data-g="'+k+'"]');
  });
  const pipEls=Array.prototype.slice.call(el.querySelectorAll('.pip'));
  const spin={},dkey={},sspin={},skey={};
  const ovOver=el.querySelector('.ov.over'),ovClear=el.querySelector('.ov.clear');
  const ovSub=el.querySelector('[data-o="oversub"]'),ovBtn=el.querySelector('[data-o="cont"]'),ovNote=el.querySelector('[data-o="contnote"]');
  ovBtn.addEventListener('click',()=>{if(handlers.cont)handlers.cont();});
  let lastWrath=null,lastNoise=null,noiseTimer=null,godTimer=null,entTimer=null,godPending=false;

  ROLES.forEach(k=>{
    if(k===role){
      boxes[k].classList.add('mine');
      sdies[k].classList.add('mine');
      boxes[k].addEventListener('click',()=>{if(!spin[k])handlers.roll(k);});
      sdies[k].addEventListener('click',()=>{if(!sspin[k])handlers.sanRoll(k);});
    }else{
      [boxes[k],sdies[k]].forEach(b=>{b.tabIndex=-1;b.setAttribute('aria-disabled','true');});
    }
  });

  function drawNoise(){
    const ctx=cv.getContext('2d');if(!ctx)return;
    const W=cv.width,H=cv.height;
    const cols=['#ff5c4d','#c4263a','#f06292','#8e3aa8','#ff9a5a','#ffb3b3','#e8d9ff','#f7c948','#7b1e2e','#ff3b30'];
    ctx.globalAlpha=1;ctx.fillStyle='#d8352a';ctx.fillRect(0,0,W,H);
    for(let i=0;i<70;i++){
      const w=8+Math.random()*W*(Math.random()<.2?.9:.35);
      const h=1+Math.random()*(Math.random()<.15?14:4);
      ctx.globalAlpha=.35+Math.random()*.6;
      ctx.fillStyle=cols[(Math.random()*cols.length)|0];
      ctx.fillRect(Math.random()*W-w*.2,Math.random()*H,w,h);
    }
    for(let i=0;i<260;i++){
      ctx.globalAlpha=.4+Math.random()*.5;
      ctx.fillStyle=cols[(Math.random()*cols.length)|0];
      ctx.fillRect(Math.random()*W,Math.random()*H,1+Math.random()*3,1+Math.random()*3);
    }
    ctx.globalAlpha=1;
  }
  let tvTimer=null;
  function tvLoop(){
    clearTimeout(tvTimer);tvTimer=null;
    tvTimer=setTimeout(()=>{if(!document.hidden)Snd.tv();tvLoop();},2200+Math.random()*3300);
  }
  function setNoise(on){
    clearInterval(noiseTimer);noiseTimer=null;
    clearTimeout(tvTimer);tvTimer=null;
    if(on){
      Snd.tv();tvLoop();
      drawNoise();
      if(!reduced)noiseTimer=setInterval(()=>{if(!document.hidden)drawNoise();},140);
    }
  }

  /* 出目の箱 */
  function renderNum(k,value){
    const face=boxes[k].firstElementChild;
    boxes[k].classList.remove('wait');
    face.className='num'+(value>=100?' w3':'');
    face.textContent=String(value);
  }
  function renderBox(k,sh){
    const face=boxes[k].firstElementChild;
    if(sh.kind==='value'){renderNum(k,sh.value);return;}
    face.className='face';
    boxes[k].classList.toggle('wait',sh.kind==='pending');
    face.textContent=sh.kind==='pending'?'待':'賽';
  }
  async function runSpin(k,final){
    const frames=reduced?0:12;
    for(let i=0;i<frames;i++){renderNum(k,rnd());await sleep(55);}
    renderNum(k,final);
  }
  function showBox(k){
    if(spin[k])return;
    const sh=shownOf(k);
    const key=sh.kind==='none'?'none':(sh.kind==='pending'?'p'+sh.n:'v'+sh.n);
    if(dkey[k]===key)return;
    const first=dkey[k]===undefined;
    dkey[k]=key;
    if(sh.kind==='value'&&!first){
      Snd.roll();
      const ot=shownOf(other(k));
      if(ot.kind==='value'&&ot.value===sh.value)setTimeout(()=>Snd.fanfare(),reduced?100:800);
    }
    if(sh.kind==='value'&&!first&&!reduced){
      spin[k]=true;
      runSpin(k,sh.value).then(()=>{spin[k]=false;showBox(k);});
      return;
    }
    renderBox(k,sh);
  }

  /* SANチェック用ダイス */
  function renderSdie(k,val){
    const b=sdies[k];
    if(!val){b.innerHTML='<span class="q">?</span>';return;}
    let h='';
    D6_FACE[val].forEach(c=>{h+='<i class="sp" style="grid-row:'+(Math.floor(c/3)+1)+';grid-column:'+(c%3+1)+'"></i>';});
    b.innerHTML=h;
  }
  async function spinSdie(k,final){
    sspin[k]=true;Snd.roll(true);
    for(let i=0;i<8;i++){renderSdie(k,rnd6());await sleep(60);}
    renderSdie(k,final);
    sspin[k]=false;
    updateSdie(k);
  }
  function updateSdie(k){
    const s=store.state;
    const on=s.god>0&&s.sanOn[k];
    sdies[k].hidden=!on;
    if(!on){skey[k]=undefined;return;}
    const rec=store.sans[k];
    const val=rec?rec.value:0;
    sdies[k].classList.toggle('tap',k===role&&val===0);
    sdies[k].setAttribute('aria-label',val?'SANチェックの出目 '+val:'SANチェックのダイス');
    if(sspin[k])return;
    const key='v'+val;
    if(skey[k]===key)return;
    const first=skey[k]===undefined;
    skey[k]=key;
    if(val>0&&!first&&!reduced){spinSdie(k,val);return;}
    renderSdie(k,val);
  }

  function update(){
    const s=store.state;
    const wrath=s.god===2;
    const eye=s.god>=1&&ROLES.some(k=>s.sanOn[k]);
    el.classList.toggle('eye',eye);
    el.classList.toggle('sanlock',!!(s.sanDue.p1||s.sanDue.p2));
    if(lastWrath!==wrath){
      clearTimeout(godTimer);clearTimeout(entTimer);godPending=false;
      if(wrath&&lastWrath!==null&&!reduced){
        el.classList.remove('entering','god');void el.offsetWidth;el.classList.add('entering');
        godPending=true;
        godTimer=setTimeout(()=>{godPending=false;el.classList.add('god');update();},1000);
        entTimer=setTimeout(()=>el.classList.remove('entering'),2300);
      }else{
        el.classList.remove('entering');
      }
      lastWrath=wrath;
    }
    if(!godPending)el.classList.toggle('god',wrath);
    const over=isOver(s),cleared=!over&&allLit(s);
    ovOver.hidden=!over;ovClear.hidden=!cleared;
    if(over){
      ovSub.textContent=ROLES.filter(k=>s.san[k]<=0).map(k=>s.names[k]).join('、')+'のSAN値が尽きました';
      ovNote.textContent=store.contPending?'送りました。反応がないときはGMに声をかけてください。':'';
    }else{store.contPending=false;}
    const noiseOn=el.classList.contains('god')&&!over&&!cleared;
    if(lastNoise!==noiseOn){lastNoise=noiseOn;setNoise(noiseOn);}
    ROLES.forEach(k=>{
      tags[k].textContent=s.names[k];
      sans[k].textContent='SAN '+s.san[k];
      boxes[k].setAttribute('aria-label',s.names[k]+'のサイコロ');
      gauges[k].style.setProperty('--c',String(s.crit[k]));
      gauges[k].style.setProperty('--f',String(Math.max(0,101-s.fumble[k])));
      showBox(k);
      updateSdie(k);
    });
    pipEls.forEach((p,i)=>{
      const c=PIP_CELLS[i];
      p.style.gridRow=String(Math.floor(c/3)+1);
      p.style.gridColumn=String(c%3+1);
      if(i===2||i===4){
        const n=i===2?6:GUESS_N,got=i===2?s.found.length:s.guessed;
        const full=isLit(s,i);
        p.style.setProperty('--n',String(n));
        p.style.setProperty('--p',String(full?n:got));
        p.classList.toggle('on',full);
        p.classList.toggle('part',!full&&got>0);
      }else{
        p.classList.toggle('on',!!s.pips[i]);
      }
    });
  }
  update();
  return {el:el,update:update,destroy:()=>{clearTimeout(godTimer);clearTimeout(entTimer);setNoise(false);},setGod(g){const f=el.querySelector('.fig');f.classList.toggle('b',g==='b');f.querySelector('.closed').src=g==='b'?IMG_CLOSED_B:IMG_CLOSED;f.querySelector('.open').src=g==='b'?IMG_OPEN_B:IMG_OPEN;}};
}

function playerView(role){

    roll:k=>{if(k===role)submitRoll(k);},

  el.appendChild(stage.el);

  sndBtn.addEventListener('click',()=>{Snd.setOn(!Snd.isOn());sndText();});sndText();
  function update(){
    stage.update();

    const mine=shownOf(role),oth=shownOf(other(role));
    const sd=store.state.sanDue,myRec=store.sans[role];
    let text=mine.kind==='pending'?'相手が押すのを待っています…':(oth.kind==='pending'?'相手の準備ができています。タップすると同時に振られます。':'');
    if(sd[role])text=(myRec&&myRec.value>0)?'GMがSAN値を減らすのを待っています。終わるまでサイコロは振れません。':'賽の神のSANチェックです。SANダイスをタップして振ってください。終わるまでサイコロは振れません。';
    else if(sd[other(role)])text='相手のSANチェックが終わるまで、サイコロは振れません。';
    msg.textContent=text;
    let key=store.status;
    if(store.canWrite===false&&key!=='offline')key='readonly';
    box.dataset.s=key;
    st.textContent=STATUS_TEXT[key]||'';
  }
  store.listeners.add(update);update();
  return {el:el,destroy(){store.listeners.delete(update);stage.destroy();}};
}

function gmView(){
  const el=document.createElement('div');
  el.className='wrap gm';
  el.innerHTML=
    '<header class="bar"><h1 class="brand">サイコロ愛好家の皆様へ<small>GM画面</small></h1>'+
      '<div class="status" data-s="connecting" aria-live="polite"><span class="dot"></span><span class="st"></span><button type="button" class="link sw">役割を選び直す</button></div></header>'+
    '<div class="gm-grid">'+
      '<div><div class="slot-stage"></div><p class="hint">プレイヤーに見えている画面のプレビューです。</p><div class="seg" role="group" aria-label="プレビューする画面" style="margin-top:8px"><span class="k">見え方</span><button type="button" class="btn" data-act="pv" data-keep="1" data-g="a" aria-pressed="true">player1の画面</button><button type="button" class="btn" data-act="pv" data-keep="1" data-g="b" aria-pressed="false">player2の画面</button><button type="button" class="btn" data-act="snd" data-keep="1" aria-pressed="true">効果音</button></div><p class="hint" data-o="phase"></p></div>'+
      '<div>'+
        '<p class="notice" hidden>GM画面の操作には、編集者以上の権限が必要です。この画面は見るだけになります。</p>'+
        '<section class="sec"><h2>賽の神</h2>'+
          '<p class="mode">いまの状態　<b data-o="mode"></b></p>'+
          '<div class="seg" role="group" aria-label="目を開く対象"><span class="k">目を開く対象</span>'+
            '<button type="button" class="btn" data-act="tgt" data-r="p1" aria-pressed="true"></button>'+
            '<button type="button" class="btn" data-act="tgt" data-r="p2" aria-pressed="true"></button></div>'+
          '<div class="gods">'+
            '<button type="button" class="btn hot" data-act="eye" aria-pressed="false">目を開く</button>'+
            '<button type="button" class="btn hot" data-act="wrath" aria-pressed="false">怒りを呼ぶ</button>'+
            '<button type="button" class="btn" data-act="calm" aria-pressed="false">鎮める</button></div>'+
          '<p class="note">目を開く: 画面はそのまま。賽の神が目を開き、対象のSANダイスが現れます（1回きり）。怒りを呼ぶ: 画面が崩れ、2人に毎ターンSANダイスが現れます。</p>'+
          '<div class="line"><button type="button" class="btn wide" data-act="sanrelease">SANチェック待ちを解除</button><span class="note" data-o="sanwait"></span></div>'+
          '<button type="button" class="btn" data-act="auto" aria-pressed="true">自動判定</button>'+
          '<p class="note">オンの間、次を自動で行います。2人同時クリティカルで目2を点灯、条件3の値を記録、片方のファンブルで目を開く、2人同時ファンブルで怒りを呼ぶ、「サイコロ」が合計30回で目1を点灯、「ダイス」が合計30回で怒りを呼ぶ。手動の操作はオンでもいつでもできます。</p>'+
        '</section>'+
        '<div class="totals" style="margin-top:18px"><div class="tot" data-t="sai"></div><div class="tot" data-t="dice"></div></div>'+
        '<div class="cards">'+cardHTML('p1')+cardHTML('p2')+'</div>'+
        '<section class="sec" style="margin-top:18px"><h2>サイコロの目（条件）</h2>'+
          '<div class="pipbtns" role="group" aria-label="点灯する目">'+PIP_LABEL.map((t,i)=>'<button type="button" class="btn pb" data-act="pip" data-i="'+i+'" aria-pressed="false"><i></i><span>'+t+'</span></button>').join('')+
          '<button type="button" class="btn" data-act="clearpips">すべて消す</button></div>'+
          '<p class="note">サイコロの目は5つ固定です。四隅が条件1〜4、中央が「脱出条件を全て推測する」。目3は、下の6つの値を見つけた数だけ6分割で点灯します（点灯が始まるまでは他の目と同じ見た目です）。</p>'+
          '<div class="chips" role="group" aria-label="条件3で見つけた値">'+FOUND_SET.map(v=>'<button type="button" class="btn chip" data-act="found" data-v="'+v+'" aria-pressed="false">'+v+'</button>').join('')+'</div>'+
          '<div class="line"><span class="k">目5 推測</span><output data-o="guess">0 / 5</output><span class="n">条件が分かった数（1つにつき5分の1が点灯）</span>'+
            '<div class="steps"><button type="button" class="btn" data-act="guess" data-d="-1">−1</button><button type="button" class="btn" data-act="guess" data-d="1">＋1</button></div></div>'+
        '</section>'+
        '<section class="sec" style="margin-top:18px"><h2>記録</h2><ol class="log"></ol></section>'+
        '<section class="sec" style="margin-top:18px"><h2>初期化</h2><button type="button" class="dangerbtn" data-act="reset">ゲームを初期化する</button></section>'+
      '</div>'+
    '</div>';
  const stage=createStage(null,{roll(){},sanRoll(){},cont:requestContinue});
  el.querySelector('.slot-stage').appendChild(stage.el);
  el.querySelectorAll('[data-act="pv"]').forEach(b=>b.addEventListener('click',()=>{
    stage.setGod(b.dataset.g);
    el.querySelectorAll('[data-act="pv"]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
  }));
  const gsnd=el.querySelector('[data-act="snd"]');
  gsnd.setAttribute('aria-pressed',String(Snd.isOn()));
  gsnd.addEventListener('click',()=>{Snd.setOn(!Snd.isOn());gsnd.setAttribute('aria-pressed',String(Snd.isOn()));});

  const notice=el.querySelector('.notice');
  const st=el.querySelector('.bar .st'),box=el.querySelector('.bar .status'),resetBtn=el.querySelector('[data-act="reset"]');
  const logEl=el.querySelector('.log');
  const tgt={p1:true,p2:true};
  let lockedPrev=null,armTimer=null;
  store.isGM=true;

  el.querySelector('.sw').addEventListener('click',()=>{location.hash='';});
  function disarm(){clearTimeout(armTimer);armTimer=null;resetBtn.dataset.armed='0';resetBtn.textContent='ゲームを初期化する';}

  function bump(s,k,type,delta){
    const w=s.words[k],old=w[type],nw=Math.max(0,old+delta);
    w[type]=nw;
    let step=0;
    if(delta>0&&nw%3===0&&nw>old)step=1;
    if(delta<0&&old%3===0&&old>0&&nw<old)step=-1;
    if(step){
      if(type==='sai')s.crit[k]=clamp(s.crit[k]+step,0,49);
      else s.fumble[k]=clamp(s.fumble[k]-step,51,101);
    }
  }

  el.addEventListener('click',e=>{
    const b=e.target.closest('button[data-act]');
    if(!b||b.disabled)return;
    const act=b.dataset.act,card=b.closest('[data-r]'),k=card&&card.dataset.r,d=Number(b.dataset.d);
    if(act==='tgt'){tgt[b.dataset.r]=!tgt[b.dataset.r];update();return;}
    if(act==='eye'){
      const list=ROLES.filter(r=>tgt[r]);
      if(!list.length||store.state.god===2)return;
      gmEdit(s=>{s.god=1;list.forEach(r=>{s.sanOn[r]=true;s.sanDue[r]=true;});});
      clearSans(list);
      addLog('賽の神が目を開いた（'+list.map(r=>store.state.names[r]).join('、')+'）');
    }else if(act==='wrath'){
      gmEdit(s=>{s.god=2;ROLES.forEach(r=>{s.sanDue[r]=true;});});clearSans(['p1','p2']);addLog('賽の神の怒り');
    }else if(act==='calm'){
      gmEdit(s=>{s.god=0;ROLES.forEach(r=>{s.sanDue[r]=false;});});clearSans(['p1','p2']);addLog('賽の神を鎮めた');
    }else if(act==='sanrelease'){
      gmEdit(s=>{ROLES.forEach(r=>{s.sanDue[r]=false;});});addLog('SANチェック待ちを解除');
    }else if(act==='auto'){
      gmEdit(s=>{s.auto=!s.auto;});
    }else if(act==='san')gmEdit(s=>{s.san[k]=clamp(s.san[k]+d,0,999);});
    else if(act==='sanapply'){
      const rec=store.sans[k];
      if(!rec||!rec.value)return;
      const loss=rec.value;
      gmEdit(s=>{s.san[k]=clamp(s.san[k]-loss,0,999);s.sanDue[k]=false;if(s.god===1)s.sanOn[k]=false;});
      clearSans([k]);
      addLog(store.state.names[k]+' SANチェック 出目'+rec.value+' → SAN −'+loss);
    }
    else if(act==='word'){
      const type=b.dataset.w;
      const events=[];
      gmEdit(s=>{
        const before=s.words.p1[type]+s.words.p2[type];
        bump(s,k,type,d);
        const after=s.words.p1[type]+s.words.p2[type];
        if(s.auto&&before<GOAL&&after>=GOAL){
          if(type==='sai'&&!s.pips[0]){s.pips[0]=true;events.push('「サイコロ」が合計'+GOAL+'回 → 目1を点灯');}
          if(type==='dice'&&s.god<2){s.god=2;ROLES.forEach(r=>{s.sanDue[r]=true;});events.push('「ダイス」が合計'+GOAL+'回 → 賽の神の怒り');}
        }
      });
      events.forEach(addLog);
      if(type==='dice'&&events.length)clearSans(['p1','p2']);
    }
    else if(act==='crit')gmEdit(s=>{s.crit[k]=clamp(s.crit[k]+d,0,49);});
    else if(act==='fumble')gmEdit(s=>{s.fumble[k]=clamp(s.fumble[k]-d,51,101);});
    else if(act==='cancelwait')cancelWait(k);
    else if(act==='guess')gmEdit(s=>{s.guessed=clamp(s.guessed+d,0,GUESS_N);});
    else if(act==='pip')gmEdit(s=>{const i=Number(b.dataset.i);s.pips[i]=!s.pips[i];});
    else if(act==='clearpips')gmEdit(s=>{s.pips=s.pips.map(()=>false);s.found=[];s.guessed=0;});
    else if(act==='found')gmEdit(s=>{
      const v=Number(b.dataset.v),i=s.found.indexOf(v);
      if(i>=0)s.found.splice(i,1);else s.found.push(v);
    });
    else if(act==='reset'){
      if(resetBtn.dataset.armed==='1'){disarm();resetAll();}
      else{resetBtn.dataset.armed='1';resetBtn.textContent='もう一度押すと初期化します';armTimer=setTimeout(disarm,3500);}
    }
  });
  el.addEventListener('change',e=>{
    const i=e.target.closest('input[data-o="san"]');
    if(i){const k=i.closest('[data-r]').dataset.r;gmEdit(s=>{s.san[k]=toInt(i.value,0,999,s.san[k]);});}
  });
  el.addEventListener('input',e=>{
    const i=e.target.closest('.nm input');
    if(i){const k=i.closest('[data-r]').dataset.r;gmEdit(s=>{s.names[k]=i.value;});}
  });

  function totalsHTML(node,label,sum,note){
    const hit=sum>=GOAL;
    node.className='tot'+(hit?' hit':'');
    node.textContent='';
    const h=document.createElement('div');h.className='h';
    const t=document.createElement('span');t.textContent=label+' 合計';
    const o=document.createElement('output');o.textContent=sum+' / '+GOAL;
    h.appendChild(t);h.appendChild(o);
    if(hit){const bd=document.createElement('span');bd.className='badge c';bd.textContent=note;h.appendChild(bd);}
    const m=document.createElement('div');m.className='meter';
    const i=document.createElement('i');i.style.width=Math.min(100,Math.round(sum/GOAL*100))+'%';
    m.appendChild(i);node.appendChild(h);node.appendChild(m);
  }

  function update(){
    stage.update();
    const s=store.state;
    const locked=store.canEdit===false;
    if(locked!==lockedPrev){
      lockedPrev=locked;
      notice.hidden=!locked;
    }
    el.querySelectorAll('button:not(.sw),input').forEach(x=>{if(!x.dataset.keep)x.disabled=locked;});

    ROLES.forEach(k=>{
      const c=el.querySelector('.card[data-r="'+k+'"]');
      c.querySelector('[data-name]').textContent=s.names[k];
      const ni=c.querySelector('.nm input');
      if(document.activeElement!==ni)ni.value=s.names[k];
      const si=c.querySelector('[data-o="san"]');
      if(document.activeElement!==si)si.value=String(s.san[k]);
      c.querySelector('output[data-o="crit"]').textContent=s.crit[k]>0?'1–'+s.crit[k]:'なし';
      c.querySelector('output[data-o="fumble"]').textContent=s.fumble[k]<=100?s.fumble[k]+'–100':'なし';
      const w=s.words[k];
      c.querySelector('output[data-o="sai"]').textContent=String(w.sai);
      c.querySelector('output[data-o="dice"]').textContent=String(w.dice);
      c.querySelector('[data-o="sain"]').textContent='あと'+(3-w.sai%3)+'回でクリティカル範囲＋1';
      c.querySelector('[data-o="dicen"]').textContent='あと'+(3-w.dice%3)+'回でファンブル範囲＋1';

      const sd=store.sans[k],sv=sd?sd.value:0,vis=s.god>0&&s.sanOn[k];
      const stEl=c.querySelector('[data-o="sanstat"]'),ap=c.querySelector('[data-act="sanapply"]');
      stEl.textContent='';
      if(!vis){stEl.textContent='ダイスは出ていません';ap.disabled=true;ap.textContent='適用';}
      else if(!sv){stEl.textContent='プレイヤーが振るのを待っています';ap.disabled=true;ap.textContent='適用';}
      else{
        const loss=sv;
        stEl.appendChild(document.createTextNode('出目 '));
        const bo=document.createElement('b');bo.textContent=String(sv);stEl.appendChild(bo);
        stEl.appendChild(document.createTextNode('　→ 1d6 で SAN −'+loss));
        ap.disabled=locked;ap.textContent='SAN −'+loss+' を適用';
      }

      const sh=shownOf(k);
      const out=c.querySelector('output[data-o="last"]'),nn=c.querySelector('[data-o="n"]'),bd=c.querySelector('[data-o="badge"]'),cw=c.querySelector('[data-act="cancelwait"]');
      cw.hidden=sh.kind!=='pending';
      if(sh.kind==='value'){
        out.textContent=String(sh.value);nn.textContent='第'+sh.n+'回';
        const isC=sh.value<=s.crit[k],isF=sh.value>=s.fumble[k];
        bd.textContent=isC?'クリティカル':(isF?'ファンブル':'');
        bd.className='badge'+(isC?' c':(isF?' f':''));
      }else if(sh.kind==='pending'){
        out.textContent='—';nn.textContent='押しました。相手を待っています';bd.textContent='待機中';bd.className='badge w';
      }else{out.textContent='—';nn.textContent='';bd.textContent='';bd.className='badge';}
    });
    el.querySelectorAll('[data-act="tgt"]').forEach(b=>{
      b.textContent=s.names[b.dataset.r];
      b.setAttribute('aria-pressed',String(!!tgt[b.dataset.r]));
    });
    const modeText=s.god===2?'怒り（毎ターンSANチェック）':(s.god===1?'目が開いている（SANチェック1回）':'静か');
    el.querySelector('[data-o="mode"]').textContent=modeText;
    const waiting=ROLES.filter(r=>s.sanDue[r]).map(r=>s.names[r]);
    el.querySelector('[data-o="sanwait"]').textContent=waiting.length?'SANチェック待ち: '+waiting.join('、')+'（完了までサイコロは振れません）':'';
    el.querySelector('[data-act="sanrelease"]').disabled=locked||!waiting.length;
    const ovr=isOver(s),clr=!ovr&&allLit(s);
    el.querySelector('[data-o="phase"]').textContent=ovr?'いま: ゲームオーバー画面（Continueで初期化されます）':(clr?'いま: クリア画面（「ゲームを初期化する」で最初から）':'');
    el.querySelector('[data-act="eye"]').setAttribute('aria-pressed',String(s.god===1));
    el.querySelector('[data-act="wrath"]').setAttribute('aria-pressed',String(s.god===2));
    el.querySelector('[data-act="calm"]').setAttribute('aria-pressed',String(s.god===0));
    const eyeBtn=el.querySelector('[data-act="eye"]');
    if(!locked)eyeBtn.disabled=s.god===2||!ROLES.some(r=>tgt[r]);
    el.querySelector('[data-act="auto"]').setAttribute('aria-pressed',String(s.auto));
    el.querySelector('[data-act="auto"]').textContent='自動判定　'+(s.auto?'オン':'オフ');

    totalsHTML(el.querySelector('[data-t="sai"]'),'サイコロ',s.words.p1.sai+s.words.p2.sai,'条件1 到達');
    totalsHTML(el.querySelector('[data-t="dice"]'),'ダイス',s.words.p1.dice+s.words.p2.dice,'怒りの条件 到達');

    el.querySelectorAll('[data-act="pip"]').forEach(b=>{
      const i=Number(b.dataset.i);
      const full=isLit(s,i);
      b.setAttribute('aria-pressed',String(full));
      b.querySelector('span').textContent=PIP_LABEL[i]+(i===2?'（'+s.found.length+'/6）':(i===4?'（'+s.guessed+'/'+GUESS_N+'）':''));
    });
    el.querySelectorAll('[data-act="found"]').forEach(b=>b.setAttribute('aria-pressed',String(s.found.indexOf(Number(b.dataset.v))>=0)));
    el.querySelector('[data-o="guess"]').textContent=s.guessed+' / '+GUESS_N;

    logEl.textContent='';
    if(!store.log.length){const li=document.createElement('li');li.textContent='まだ記録はありません。';logEl.appendChild(li);}
    store.log.forEach(t=>{const li=document.createElement('li');li.textContent=t;logEl.appendChild(li);});

    let key=store.status;
    if(locked&&key!=='offline')key='readonly';
    box.dataset.s=key;
    st.textContent=key==='readonly'?'編集権限がありません。':(STATUS_TEXT[key]||'');
  }
  store.listeners.add(update);update();
  return {el:el,destroy(){store.isGM=false;store.listeners.delete(update);stage.destroy();clearTimeout(armTimer);}};
}

/* ---------- ルーティング ---------- */
const app=document.getElementById('app');
let view=null;
function route(){
  if(view){view.destroy();view=null;}
  app.textContent='';
  const h=location.hash.replace(/^#/,'');
  view=(h==='p1'||h==='p2')?playerView(h):(h==='gm'?gmView():pickerView());
  app.appendChild(view.el);
}
window.addEventListener('hashchange',route);
route();
connect();
})();
</script>
</html>
